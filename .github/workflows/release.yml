name: Build and publish release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build SPT-QuestMap ${{ github.ref_name }}
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      SPT_VERSION: 4.1.6
      SPT_CLIENT_BUILD: 40743

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
              throw "Release tag '$env:RELEASE_TAG' is not a semantic version such as 1.1.0."
          }

          $projects = @(
              'src/SPTQuestMap/SPTQuestMap.csproj',
              'src/SPTQuestMap.Core/SPTQuestMap.Core.csproj',
              'src/SPTQuestMap.Client/SPTQuestMap.Client.csproj'
          )
          foreach ($projectPath in $projects) {
              [xml]$project = Get-Content -LiteralPath $projectPath -Raw
              $projectVersion = @($project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
              if ($projectVersion.Count -ne 1 -or $projectVersion[0] -ne $env:RELEASE_TAG) {
                  throw "Tag '$env:RELEASE_TAG' does not match $projectPath version '$($projectVersion[0])'."
              }
          }

          $pluginVersion = Select-String -LiteralPath 'src/SPTQuestMap.Client/QuestMapClientPlugin.cs' `
              -Pattern 'PluginVersion\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $pluginVersion -or $pluginVersion.Matches[0].Groups[1].Value -ne $env:RELEASE_TAG) {
              throw "Tag '$env:RELEASE_TAG' does not match the client BepInEx plugin version."
          }

      - name: Download private SPT 4.1 build references
        shell: pwsh
        env:
          EFT_REFERENCE_ARCHIVE_4_1_URL: ${{ secrets.EFT_REFERENCE_ARCHIVE_4_1_URL }}
          EFT_REFERENCE_ARCHIVE_4_1_SHA256: ${{ secrets.EFT_REFERENCE_ARCHIVE_4_1_SHA256 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EFT_REFERENCE_ARCHIVE_4_1_URL) -or
              $env:EFT_REFERENCE_ARCHIVE_4_1_SHA256 -notmatch '^[0-9A-Fa-f]{64}$') {
              throw 'Configure EFT_REFERENCE_ARCHIVE_4_1_URL and EFT_REFERENCE_ARCHIVE_4_1_SHA256 for the private ZIP produced by scripts/package-build-references.ps1.'
          }
          $sptInstallRoot = Join-Path $env:RUNNER_TEMP 'spt-install'
          New-Item -ItemType Directory -Force -Path $sptInstallRoot | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'eft-spt-4.1.6-build-references.zip'
          Invoke-WebRequest -Uri $env:EFT_REFERENCE_ARCHIVE_4_1_URL -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $env:EFT_REFERENCE_ARCHIVE_4_1_SHA256) {
              throw 'Private reference archive SHA-256 mismatch.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $sptInstallRoot -Force
          $sptCore = Join-Path $sptInstallRoot 'SPT_Runtime/SPTarkov.Server.Core.dll'
          if ([System.Reflection.AssemblyName]::GetAssemblyName($sptCore).Version.ToString() -ne '4.1.6.0' -or
              (Get-FileHash -LiteralPath $sptCore -Algorithm SHA256).Hash -ne '490409F7C67480A8BF647DA67ADA8B91361330C2A9324D9E9787CD1EBAF5BF27') {
              throw 'SPT server references must match 4.1.6 / source commit 731d7a2.'
          }
          $assemblyCSharp = Join-Path $sptInstallRoot 'EscapeFromTarkov_Data/Managed/Assembly-CSharp.dll'
          if ((Get-FileHash -LiteralPath $assemblyCSharp -Algorithm SHA256).Hash -ne 'EE25CEE1259777B38ED8B3E7841FDC2DB3C98540B1469FA539B1FF183476E436') {
              throw 'Assembly-CSharp.dll does not match the validated EFT 40743 ABI.'
          }
          "SPT_INSTALL_ROOT=$sptInstallRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build and test
        shell: pwsh
        run: |
          ./scripts/build.ps1 `
              -Target Both `
              -Configuration Release `
              -SptRoot $env:SPT_INSTALL_ROOT

      - name: Package install-ready archive
        shell: pwsh
        run: |
          ./scripts/package-release.ps1 `
              -Target Both `
              -Configuration Release `
              -Version $env:RELEASE_TAG `
              -OutputDirectory 'artifacts/release'

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = "artifacts/release/SPT-QuestMap-$env:RELEASE_TAG.zip"
          gh release create $env:RELEASE_TAG $archive `
              --verify-tag `
              --generate-notes `
              --title "SPT-QuestMap $env:RELEASE_TAG"
