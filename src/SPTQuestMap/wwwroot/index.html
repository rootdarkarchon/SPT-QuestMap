<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPT Quest Map</title>
  <link rel="stylesheet" href="/SPTQuestMap/app.css">
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">SPT 4.0.13</p>
      <h1>Quest Map</h1>
      <p class="lede">Read-only quest planning from the profiles currently loaded by this SPT server.</p>
    </header>

    <section class="panel" aria-labelledby="profiles-heading">
      <div>
        <h2 id="profiles-heading">Loaded profiles</h2>
        <p id="status" role="status">Checking the active SPT browser session…</p>
      </div>
      <button id="refresh" type="button">Refresh</button>
      <ul id="profiles" aria-live="polite"></ul>
    </section>
  </main>
  <script>
    const statusElement = document.querySelector('#status');
    const profilesElement = document.querySelector('#profiles');
    const refreshButton = document.querySelector('#refresh');

    async function loadProfiles() {
      refreshButton.disabled = true;
      statusElement.classList.remove('error');
      statusElement.textContent = 'Loading profiles…';
      profilesElement.replaceChildren();

      try {
        const response = await fetch('/questmap/api/profiles', { cache: 'no-store', credentials: 'same-origin' });
        const body = await response.json();
        if (!response.ok) throw new Error(body.message || `Request failed (${response.status})`);

        for (const profile of body.profiles) {
          const item = document.createElement('li');
          const name = document.createElement('strong');
          name.textContent = profile.nickname;
          const details = document.createElement('small');
          details.textContent = `${profile.side} · level ${profile.level} · ${profile.id}`;
          item.append(name, details);
          profilesElement.append(item);
        }

        statusElement.textContent = body.profiles.length
          ? `${body.profiles.length} valid profile${body.profiles.length === 1 ? '' : 's'} loaded.`
          : 'No valid profiles are currently loaded.';
      } catch (error) {
        statusElement.classList.add('error');
        statusElement.textContent = error.message;
      } finally {
        refreshButton.disabled = false;
      }
    }

    refreshButton.addEventListener('click', loadProfiles);
    loadProfiles();
  </script>
</body>
</html>
