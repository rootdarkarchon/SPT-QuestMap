<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="/SPTQuestMap/questmap.css?v=20260804-8">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="primary-row">
        <div class="brand"><span class="eyebrow">SPT 4.0.13</span><h1 data-i18n="app.heading"></h1></div>
        <div class="identity-controls" data-i18n-aria="controls.aria">
          <button id="refresh" class="primary refresh-button" type="button" data-i18n-title="refresh" data-i18n-aria="refresh"><span aria-hidden="true">⟳</span></button>
          <div id="profile-picker" class="profile-field">
            <button id="profile-trigger" class="profile-select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" data-i18n-aria="profile.aria">
              <span class="profile-select-face" aria-hidden="true">
              <span id="profile-side-icon" class="profile-side-icon"></span>
              <strong id="profile-name" class="profile-name">—</strong>
              <span id="profile-level" class="profile-level">—</span>
              <span class="profile-chevron">⌄</span>
              </span>
            </button>
            <select id="profile-select" hidden></select>
            <div id="profile-menu" class="profile-menu" role="listbox" data-i18n-aria="profile.aria" hidden></div>
          </div>
          <label class="field language-field"><span data-i18n="language.label"></span><select id="language-select" data-i18n-aria="language.aria"></select></label>
        </div>
      </div>
      <div class="filterbar">
        <div class="filter-tools">
          <div class="filter-toggles">
            <button id="show-all" class="filter-toggle" type="button" aria-pressed="false" data-i18n-title="showAllFuture" data-i18n-aria="showAllFuture"><span aria-hidden="true">⇉</span></button>
            <button id="show-finished" class="filter-toggle" type="button" aria-pressed="true" data-i18n-title="showFinished" data-i18n-aria="showFinished"><span aria-hidden="true">✓</span></button>
            <button id="level-only" class="filter-toggle level-toggle" type="button" aria-pressed="true" data-i18n-title="levelEligible" data-i18n-aria="levelEligible"><span id="level-toggle-text">≤ ?</span></button>
          </div>
          <label class="field search-field"><span class="sr-only" data-i18n="search.label"></span><input id="search" type="search" data-i18n-placeholder="search.placeholder" autocomplete="off"></label>
        </div>
        <div class="filter-separator" aria-hidden="true"></div>
        <div id="trader-filter" class="trader-options" role="radiogroup" data-i18n-aria="trader.label"></div>
      </div>
    </header>
    <main class="workspace">
      <section id="viewport" class="viewport" data-i18n-aria="graph.aria">
        <canvas id="graph" tabindex="0" data-i18n-aria="graph.canvasAria"></canvas>
        <aside id="in-progress-panel" class="in-progress-panel" data-i18n-aria="inProgress.title">
          <button id="in-progress-toggle" class="in-progress-toggle" type="button" aria-expanded="false" data-i18n-title="inProgress.title">
            <span class="in-progress-title" data-i18n="inProgress.title"></span><span class="in-progress-chevron" aria-hidden="true">›</span>
          </button>
          <div id="in-progress-content" class="in-progress-content"></div>
        </aside>
        <div class="graph-actions" data-i18n-aria="graph.actionsAria">
          <button id="zoom-in" type="button" data-i18n-title="zoom.in">+</button><button id="zoom-out" type="button" data-i18n-title="zoom.out">−</button>
          <button id="fit" type="button" data-i18n="fit"></button><button id="focus" type="button" disabled data-i18n="focus"></button>
          <button id="clear-focus" type="button" hidden data-i18n="focus.clear"></button><button id="clear-selection" type="button" disabled data-i18n="selection.clear"></button>
        </div>
        <div id="loading" class="loading-state" role="status" data-i18n="loading.topology"></div>
        <div id="error" class="error-state" role="alert" hidden></div>
        <div class="legend" data-i18n-aria="legend.aria">
          <strong data-i18n="legend.states"></strong>
          <span><i style="--swatch:#78808b"></i><span data-i18n="state.Locked"></span></span><span><i style="--swatch:#827465"></i><span data-i18n="legend.priorGate"></span></span>
          <span><i style="--swatch:#9d7a45"></i><span data-i18n="legend.levelGate"></span></span><span><i style="--swatch:#8b659e"></i><span data-i18n="legend.traderRequirement"></span></span>
          <span><i style="--swatch:#b06453"></i><span data-i18n="state.TraderUnavailable"></span></span><span><i class="future-key"></i><span data-i18n="legend.futureTier"></span></span>
          <span><i style="--swatch:#4d9e72"></i><span data-i18n="state.Available"></span></span><span><i style="--swatch:#3f89b8"></i><span data-i18n="state.InProgress"></span></span>
          <span><i style="--swatch:#d4a83f"></i><span data-i18n="state.ReadyToFinish"></span></span><span><i style="--swatch:#557e5b"></i><span data-i18n="state.Completed"></span></span>
          <span><i style="--swatch:#9c4f54"></i><span data-i18n="legend.failedExcluded"></span></span><span><i style="--swatch:#ba8752"></i><span data-i18n="state.Pending"></span></span>
          <span><i style="--swatch:#945bc4"></i><span data-i18n="legend.collectorRoute"></span></span><span><i style="--swatch:#234f7f"></i><span data-i18n="legend.lightkeeperRoute"></span></span>
          <span><b class="edge-key success"></b><span data-i18n="legend.requiresSuccess"></span></span><span><b class="edge-key failure"></b><span data-i18n="legend.requiresFailure"></span></span>
          <span><b class="edge-key started"></b><span data-i18n="legend.requiresStarted"></span></span><span><b class="edge-key outcome"></b><span data-i18n="legend.requiresOutcome"></span></span>
        </div>
        <div id="metrics" class="metrics" aria-live="polite"></div>
      </section>
      <aside id="details" class="details" data-i18n-aria="details.aria">
        <div class="empty-details"><span class="empty-icon">◇</span><h2 data-i18n="details.selectTitle"></h2><p data-i18n="details.selectHelp"></p></div>
      </aside>
    </main>
  </div>
  <script>
  'use strict';
  const STORAGE_KEY = 'sptQuestMap.ui.v1';
  const NODE_W = 244, NODE_H = 84, LAYER_GAP = 118, ROW_GAP = 18, LAYOUT_MARGIN = 90, GRID_SIZE = 420;
  const OVERVIEW_SCALE = .48, MIN_SCALE = .08, MAX_SCALE = 2.5;
  const TRADER_ORDER = ['54cb50c76803fa8b248b4571','54cb57776803fa99248b456e','579dc571d53a0658a154fbec','58330581ace78e27b8b10cee','5935c25fb3acc3127c3d8cd9','5a7c2eca46aef81a7ca2145d','5ac3b934156ae10c4430e83c','5c0647fdd443bc2504c2d371','6617beeaa9cfa777ca915b7c','638f541a29ffd1183d187f57','656f0f98d80a697f855d34b1'];
  const UNKNOWN_TRADER_IMAGE = '/files/trader/avatar/unknown.png';
  const COLORS = {
    Locked:'#78808b', PrerequisiteGated:'#827465', LevelGated:'#9d7a45', TraderGated:'#8b659e', TraderUnavailable:'#b06453',
    Available:'#4d9e72', InProgress:'#3f89b8', ReadyToFinish:'#d4a83f', Completed:'#557e5b',
    Failed:'#9c4f54', Excluded:'#b33f4a', RestartableFailure:'#b76c49', Expired:'#74535d', Pending:'#ba8752'
  };
  const ids = ['profile-picker','profile-trigger','profile-menu','profile-select','profile-side-icon','profile-name','profile-level','refresh','show-all','show-finished','level-only','level-toggle-text','search','trader-filter','language-select','viewport','graph','in-progress-panel','in-progress-toggle','in-progress-content','zoom-in','zoom-out','fit','focus','clear-focus','clear-selection','loading','error','metrics','details'];
  const els = Object.fromEntries(ids.map(id => [id.replaceAll('-','_'), document.getElementById(id)]));
  const ctx = els.graph.getContext('2d', { alpha:false });
  const ui = {
    profiles:[], topology:null, profile:null, nodeById:new Map(), stateById:new Map(), traderStateById:new Map(),
    incoming:new Map(), outgoing:new Map(), normalLayout:null, activeLayout:null, applicable:new Set(), visible:new Set(), collectorPath:new Set(), lightkeeperPath:new Set(),
    selectedId:null, focusedId:null, focusIds:null, prerequisiteIds:new Set(), successorIds:new Set(), highlightedEdges:new Set(),
    hoverId:null,hoverPredecessorIds:new Set(),hoverSuccessorIds:new Set(),hoveredEdges:new Set(),
    view:{scale:.5,tx:0,ty:0}, dragging:false, dragStart:null, dragMoved:false, pointerDownNode:null,fastRenderUntil:0,detailedRenderTimer:0,
    framePending:false, dpr:1, storage:loadStorage(), imageCache:new Map(), mapFadeCache:new Map(), overlayMs:0, firstRenderMs:0, lastRenderMs:0, visibleEdgeCount:0,
    viewportSaveTimer:0, language:'en', browserLocale:'en', languages:[], strings:{},traderFilter:''
  };

  function loadStorage() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; } }
  function t(key, values={}) {
    const template=ui.strings[key]??key;
    return template.replace(/\{([a-zA-Z0-9_]+)\}/g,(_,name)=>values[name]??`{${name}}`);
  }
  function languageUrl(path,language=ui.language){const separator=path.includes('?')?'&':'?';return`${path}${separator}language=${encodeURIComponent(language)}`;}
  async function loadBootstrap(language) {
    const query=language?`?language=${encodeURIComponent(language)}`:'';
    const bootstrap=await fetchJson(`/questmap/api/bootstrap${query}`);
    ui.language=bootstrap.language;ui.browserLocale=bootstrap.browserLocale||'en';ui.languages=bootstrap.languages||[];ui.strings=bootstrap.strings||{};
    document.documentElement.lang=ui.language;document.title=t('app.title');applyStaticTranslations();populateLanguageSelector();
    return bootstrap;
  }
  function applyStaticTranslations(){
    document.querySelectorAll('[data-i18n]').forEach(item=>item.textContent=t(item.dataset.i18n));
    document.querySelectorAll('[data-i18n-aria]').forEach(item=>item.setAttribute('aria-label',t(item.dataset.i18nAria)));
    document.querySelectorAll('[data-i18n-placeholder]').forEach(item=>item.setAttribute('placeholder',t(item.dataset.i18nPlaceholder)));
    document.querySelectorAll('[data-i18n-title]').forEach(item=>item.setAttribute('title',t(item.dataset.i18nTitle)));
  }
  function populateLanguageSelector(){
    els.language_select.replaceChildren(...ui.languages.map(language=>{const option=document.createElement('option');option.value=language.code;option.textContent=language.name;return option;}));
    els.language_select.value=ui.language;
  }
  function saveStorage() {
    const profileId = els.profile_select.value;
    ui.storage.selectedProfileId = profileId || null;
    ui.storage.showAllFuture = toggleEnabled(els.show_all);
    ui.storage.showFinished = toggleEnabled(els.show_finished);
    ui.storage.levelEligibleOnly = toggleEnabled(els.level_only);
    ui.storage.inProgressExpanded = els.in_progress_panel.classList.contains('expanded');
    ui.storage.search = els.search.value;
    ui.storage.traderFilter = ui.traderFilter;
    ui.storage.language = ui.language;
    ui.storage.profiles ||= {};
    const profileForState=ui.profile?.profileId;
    if (profileForState) ui.storage.profiles[profileForState] = { selectedId:ui.selectedId, focusedId:ui.focusedId };
    const viewportScope=currentViewportScope();if(viewportScope)ui.storage.viewport={scope:viewportScope,view:{...ui.view}};
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(ui.storage)); } catch {}
  }
  function currentViewportScope(){if(!ui.topology||!ui.profile)return null;return[ui.topology.version,ui.profile.profileId,toggleEnabled(els.show_all)?1:0,toggleEnabled(els.show_finished)?1:0,toggleEnabled(els.level_only)?1:0,ui.traderFilter,els.search.value.trim(),ui.focusedId||'',ui.selectedId||''].join('|');}
  function restoreScopedViewport(){const saved=ui.storage.viewport,scope=currentViewportScope();if(!scope||saved?.scope!==scope||!validView(saved.view))return false;ui.view={...saved.view};requestRender();return true;}
  async function fetchJson(url, cache='no-store') {
    const response = await fetch(url, {cache,credentials:'same-origin'});
    let body; try { body = await response.json(); } catch { body = {}; }
    if (!response.ok) throw new Error(body.message || `${response.status} ${response.statusText}`);
    return body;
  }
  function showError(error) {
    console.error(error); els.error.textContent = error?.message || String(error); els.error.hidden = false; els.loading.hidden = true;
    els.refresh.disabled = false; els.profile_select.disabled = false;els.profile_trigger.disabled=false; els.language_select.disabled=false;
  }
  function setBusy(message) { closeProfileMenu();els.loading.textContent=message; els.loading.hidden=false;els.error.hidden=true;els.refresh.disabled=true;els.profile_select.disabled=true;els.profile_trigger.disabled=true;els.language_select.disabled=true; }
  function clearBusy() { els.loading.hidden=true;els.refresh.disabled=false;els.profile_select.disabled=false;els.profile_trigger.disabled=false;els.language_select.disabled=false; }

  function applyProfiles(profiles) {
    ui.profiles = profiles;
    const previous = els.profile_select.value || ui.storage.selectedProfileId;
    els.profile_select.replaceChildren(...profiles.map(profile => {
      const option = document.createElement('option'); option.value=profile.id;
      option.textContent=`${profile.nickname} · ${profile.side} · ${t('profile.level')} ${profile.level}`; option.title=profile.id; return option;
    }));
    if (profiles.some(profile => profile.id === previous)) els.profile_select.value=previous;
    else if (profiles.length) els.profile_select.value=profiles[0].id;
    renderProfileMenu();
    renderProfileSelector();
  }
  function profileSideClass(side){const value=(side||'').toLocaleLowerCase();return value==='bear'?'bear':value==='usec'?'usec':'unknown';}
  function renderProfileMenu(){
    els.profile_menu.replaceChildren(...ui.profiles.map(profile=>{
      const button=element('button','profile-option');button.type='button';button.role='option';button.dataset.profileId=profile.id;button.title=profile.id;
      const icon=element('span',`profile-side-icon ${profileSideClass(profile.side)}`),name=element('strong','profile-option-name',profile.nickname),level=element('span','profile-option-level',String(profile.level));
      button.append(icon,name,level);button.addEventListener('click',()=>chooseProfile(profile.id));return button;
    }));
  }
  function renderProfileSelector(){
    const profile=ui.profiles.find(item=>item.id===els.profile_select.value);
    els.profile_name.textContent=profile?.nickname||'—';
    els.profile_level.textContent=profile?.level??'—';
    els.profile_side_icon.className=`profile-side-icon ${profileSideClass(profile?.side)}`;
    els.profile_side_icon.title=profile?.side||'';
    for(const option of els.profile_menu.querySelectorAll('.profile-option')){const selected=option.dataset.profileId===profile?.id;option.classList.toggle('selected',selected);option.setAttribute('aria-selected',String(selected));}
  }
  function openProfileMenu(){if(els.profile_trigger.disabled||!ui.profiles.length)return;els.profile_picker.classList.add('open');els.profile_menu.hidden=false;els.profile_trigger.setAttribute('aria-expanded','true');const selected=els.profile_menu.querySelector('.selected');selected?.scrollIntoView({block:'nearest'});}
  function closeProfileMenu(){els.profile_picker.classList.remove('open');els.profile_menu.hidden=true;els.profile_trigger.setAttribute('aria-expanded','false');}
  function toggleProfileMenu(){els.profile_picker.classList.contains('open')?closeProfileMenu():openProfileMenu();}
  async function chooseProfile(profileId){closeProfileMenu();if(!profileId||profileId===els.profile_select.value)return;els.profile_select.value=profileId;renderProfileSelector();saveStorage();ui.selectedId=null;ui.focusedId=null;await loadProfile(profileId);}
  function applyTopology(topology) {
    const changed = !ui.topology || ui.topology.version !== topology.version;
    ui.topology=topology;ui.nodeById=new Map(topology.quests.map(node=>[node.id,node]));ui.collectorPath=new Set(topology.collectorPathQuestIds||[]);ui.lightkeeperPath=new Set(topology.lightkeeperPathQuestIds||[]);
    ui.incoming=groupEdges(topology.edges,'targetId'); ui.outgoing=groupEdges(topology.edges,'sourceId'); populateTraderFilter();
    if (changed) {
      ui.normalLayout=buildLayout(new Set(ui.nodeById.keys()));ui.activeLayout=ui.normalLayout;ui.view={scale:.5,tx:0,ty:0};
    }
  }
  function groupEdges(edges,key) {
    const groups=new Map(); edges.forEach((edge,index)=>{ const value=edge[key]; if(!groups.has(value)) groups.set(value,[]); groups.get(value).push({edge,index}); }); return groups;
  }
  function populateTraderFilter() {
    const selected=ui.storage.traderFilter??ui.traderFilter;
    const rank=new Map(TRADER_ORDER.map((id,index)=>[id,index]));
    const questTraderIds=new Set(ui.topology.quests.map(quest=>quest.traderId));
    const traders=[...(ui.topology.traders||[])].filter(trader=>questTraderIds.has(trader.id)).sort((a,b)=>(rank.get(a.id)??999)-(rank.get(b.id)??999)||a.name.localeCompare(b.name,ui.browserLocale));
    if(selected&&traders.some(trader=>trader.id===selected))ui.traderFilter=selected;else ui.traderFilter='';
    const choices=[{id:'',name:t('trader.allShort'),imageUrl:UNKNOWN_TRADER_IMAGE},...traders];
    els.trader_filter.replaceChildren(...choices.map(trader=>{
      const button=element('button','trader-option');button.type='button';button.role='radio';button.dataset.traderId=trader.id;button.title=trader.name;button.setAttribute('aria-checked',String(trader.id===ui.traderFilter));
      const image=document.createElement('img');image.src=trader.imageUrl||UNKNOWN_TRADER_IMAGE;image.alt='';image.addEventListener('error',()=>{if(image.src.endsWith('/unknown.png'))image.hidden=true;else image.src=UNKNOWN_TRADER_IMAGE;});
      button.append(image,element('span','',trader.name));button.addEventListener('click',()=>selectTrader(trader.id));return button;
    }));
    updateTraderSelection();
  }
  function selectTrader(id){if(ui.focusIds)return;ui.traderFilter=id;updateTraderSelection();updateVisible();renderDetails();saveStorage();}
  function updateTraderSelection(){for(const button of els.trader_filter.querySelectorAll('.trader-option')){const selected=button.dataset.traderId===ui.traderFilter;button.classList.toggle('selected',selected);button.setAttribute('aria-checked',String(selected));}}
  function toggleEnabled(button){return button.getAttribute('aria-pressed')==='true';}
  function setToggle(button,enabled){button.setAttribute('aria-pressed',String(Boolean(enabled)));button.classList.toggle('active',Boolean(enabled));}
  function renderLevelToggle(){els.level_toggle_text.textContent=`≤ ${ui.profile?.level??'?'}`;}

  async function loadProfile(profileId) {
    if(!profileId) return; setBusy(t('loading.profile'));
    try {
      const started=performance.now(); const profile=await fetchJson(languageUrl(`/questmap/api/profiles/${encodeURIComponent(profileId)}/state`));
      ui.profile=profile; ui.stateById=new Map(profile.quests.map(item=>[item.questId,item]));
      ui.traderStateById=new Map(profile.traders.map(item=>[item.traderId,item])); ui.applicable=new Set(profile.allApplicableQuestIds);
      ui.overlayMs=performance.now()-started;restoreProfileUi(profileId);renderLevelToggle();ui.activeLayout=ui.normalLayout;updateVisible(false);if(!restoreScopedViewport())fitVisible();renderDetails();renderInProgressPanel();
      saveStorage(); clearBusy();
    } catch(error) { showError(error); }
  }
  function restoreProfileUi(profileId) {
    const saved=ui.storage.profiles?.[profileId] || {};
    ui.selectedId=ui.applicable.has(saved.selectedId)?saved.selectedId:null;
    ui.focusedId=ui.applicable.has(saved.focusedId)?saved.focusedId:null;
    ui.focusIds=ui.focusedId?computeChain(ui.focusedId):null;
    updateSelectionHighlight(); updateActionButtons();
  }
  function showEmptyProfiles() {
    ui.profile=null; ui.visible.clear(); ui.selectedId=null;renderLevelToggle();renderDetails();renderInProgressPanel();
    els.loading.textContent=t('profiles.none'); els.loading.hidden=false; els.refresh.disabled=false; requestRender();
  }
  async function refreshAll() {
    saveStorage(); const selected=els.profile_select.value; setBusy(t('loading.refresh'));
    try {
      const [profilesResult,topology]=await Promise.all([fetchJson(languageUrl('/questmap/api/profiles')),fetchJson(languageUrl('/questmap/api/topology'))]);
      applyTopology(topology); applyProfiles(profilesResult.profiles||[]);
      if(ui.profiles.some(profile=>profile.id===selected)) els.profile_select.value=selected;
      renderProfileSelector();
      if(ui.profiles.length) await loadProfile(els.profile_select.value); else showEmptyProfiles(); clearBusy();
    } catch(error){ showError(error); }
  }

  function buildLayout(idSet) {
    const started=performance.now(), idList=[...idSet].filter(id=>ui.nodeById.has(id)), ids=new Set(idList), memo=new Map(), visiting=new Set();
    const rankOf=id=>{
      if(memo.has(id)) return memo.get(id); if(visiting.has(id)) return 0; visiting.add(id); let rank=0;
      for(const item of ui.incoming.get(id)||[]) if(ids.has(item.edge.sourceId)) rank=Math.max(rank,rankOf(item.edge.sourceId)+1);
      visiting.delete(id); memo.set(id,Math.min(rank,80)); return memo.get(id);
    };
    const layers=new Map();
    for(const id of idList){ const rank=rankOf(id); if(!layers.has(rank)) layers.set(rank,[]); layers.get(rank).push(id); }
    const positions=new Map();
    for(const [rank,layer] of [...layers].sort((a,b)=>a[0]-b[0])){
      layer.sort((a,b)=>{const qa=ui.nodeById.get(a),qb=ui.nodeById.get(b);return qa.traderName.localeCompare(qb.traderName)||qa.name.localeCompare(qb.name)||a.localeCompare(b);});
      layer.forEach((id,row)=>positions.set(id,{x:LAYOUT_MARGIN+rank*(NODE_W+LAYER_GAP),y:LAYOUT_MARGIN+row*(NODE_H+ROW_GAP),w:NODE_W,h:NODE_H}));
    }
    return finishLayout(positions,started);
  }
  function buildCompactedLayout(idSet,referenceLayout){
    const started=performance.now(),columns=new Map();
    for(const id of idSet){const p=referenceLayout?.positions.get(id);if(!p)continue;if(!columns.has(p.x))columns.set(p.x,[]);columns.get(p.x).push({id,y:p.y});}
    const positions=new Map();let column=0;
    for(const [,items] of [...columns].sort((a,b)=>a[0]-b[0])){
      items.sort((a,b)=>a.y-b.y||a.id.localeCompare(b.id));
      items.forEach((item,row)=>positions.set(item.id,{x:LAYOUT_MARGIN+column*(NODE_W+LAYER_GAP),y:LAYOUT_MARGIN+row*(NODE_H+ROW_GAP),w:NODE_W,h:NODE_H}));column++;
    }
    return finishLayout(positions,started);
  }
  function finishLayout(positions,started){
    const edgeGeometry=[];
    ui.topology.edges.forEach((edge,index)=>{
      const source=positions.get(edge.sourceId),target=positions.get(edge.targetId); if(!source||!target) return;
      const x1=source.x+source.w,y1=source.y+source.h/2,x2=target.x,y2=target.y+target.h/2,bend=Math.max(42,Math.abs(x2-x1)*.42);
      const columnDistance=Math.round((target.x-source.x)/(NODE_W+LAYER_GAP)),skippedColumns=Math.max(0,columnDistance-1),horizontal=Math.abs(y2-y1)<1,arch=skippedColumns&&horizontal?Math.min(64,18+skippedColumns*10):0;
      edgeGeometry.push({index,edge,x1,y1,x2,y2,c1x:x1+bend,c1y:y1-arch,c2x:x2-bend,c2y:y2-arch});
    });
    const values=[...positions.values()];

  els.profile_menu.addEventListener('keydown',event=>{const options=[...els.profile_menu.querySelectorAll('.profile-option')],index=options.indexOf(document.activeElement);if(event.key==='Escape'){event.preventDefault();closeProfileMenu();els.profile_trigger.focus();}else if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();options[(index+(event.key==='ArrowDown'?1:-1)+options.length)%options.length]?.focus();}});
  document.addEventListener('pointerdown',event=>{if(!els.profile_picker.contains(event.target))closeProfileMenu();});
  for(const control of [els.show_all,els.show_finished,els.level_only])control.addEventListener('click',()=>{if(control.disabled)return;setToggle(control,!toggleEnabled(control));updateVisible();renderDetails();saveStorage();});
  els.in_progress_toggle.addEventListener('click',()=>setInProgressExpanded(!els.in_progress_panel.classList.contains('expanded')));
  let searchTimer=0;els.search.addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{updateVisible();saveStorage();},100);});
  els.fit.addEventListener('click',fitVisible);els.focus.addEventListener('click',activateFocus);els.clear_focus.addEventListener('click',()=>clearFocus());els.clear_selection.addEventListener('click',clearSelection);
  els.zoom_in.addEventListener('click',()=>zoomAt(1.22,els.viewport.clientWidth/2,els.viewport.clientHeight/2));els.zoom_out.addEventListener('click',()=>zoomAt(1/1.22,els.viewport.clientWidth/2,els.viewport.clientHeight/2));
  els.graph.addEventListener('wheel',event=>{event.preventDefault();beginFastRender();const rect=els.graph.getBoundingClientRect();zoomAt(event.deltaY<0?1.13:1/1.13,event.clientX-rect.left,event.clientY-rect.top);},{passive:false});
  els.graph.addEventListener('pointerdown',event=>{if(event.button!==0)return;ui.pointerDownNode=hitNode(event);ui.dragging=true;ui.dragMoved=false;ui.dragStart={x:event.clientX,y:event.clientY,tx:ui.view.tx,ty:ui.view.ty};els.graph.setPointerCapture(event.pointerId);});
  els.graph.addEventListener('pointermove',event=>{
    if(ui.dragging){const dx=event.clientX-ui.dragStart.x,dy=event.clientY-ui.dragStart.y;if(Math.hypot(dx,dy)>3)ui.dragMoved=true;if(ui.dragMoved){ui.view.tx=ui.dragStart.tx+dx;ui.view.ty=ui.dragStart.ty+dy;requestRender();}return;}
    const hit=hitNode(event);if(hit!==ui.hoverId){updateHoverHighlight(hit);els.graph.style.cursor=hit?'pointer':'grab';requestRender();}
  });
  function finishPointer(event){if(!ui.dragging)return;const wasMoved=ui.dragMoved,downNode=ui.pointerDownNode;ui.dragging=false;ui.dragMoved=false;ui.dragStart=null;ui.pointerDownNode=null;if(els.graph.hasPointerCapture(event.pointerId))els.graph.releasePointerCapture(event.pointerId);if(!wasMoved){const hit=hitNode(event);if(hit&&hit===downNode)selectQuest(hit);else clearSelection();}scheduleViewportSave();requestRender();}
  els.graph.addEventListener('pointerup',finishPointer);els.graph.addEventListener('pointercancel',finishPointer);
  els.graph.addEventListener('dblclick',event=>{event.preventDefault();const hit=hitNode(event);if(!hit)return;selectQuest(hit);activateFocus();});
  els.graph.addEventListener('pointerleave',()=>{if(!ui.dragging&&ui.hoverId){updateHoverHighlight(null);requestRender();}});
  els.graph.addEventListener('keydown',event=>{if(event.key==='Escape')clearSelection();else if(event.key==='+'||event.key==='=')els.zoom_in.click();else if(event.key==='-')els.zoom_out.click();});
  new ResizeObserver(()=>requestRender()).observe(els.viewport);
  initialize();
  </script>
</body>
</html>
